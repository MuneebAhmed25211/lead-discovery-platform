[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-discovery-backend"
version = "1.0.0"
description = "Lead Discovery and Qualification Platform — FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",

    # Pydantic v2 — schemas, settings, validation
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",

    # Supabase
    "supabase==2.10.0",
    "httpx==0.27.2",           # used by supabase client + crawlers

    # LangGraph + LangChain (for graph pipeline)
    "langgraph==0.2.55",
    "langchain-core>=0.3.29,<0.4.0",
    "langchain-groq==0.2.3",

    # Async HTTP + crawling
    "httpx[http2]==0.27.2",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "trafilatura==2.0.0",
    # robots.txt parsing — stdlib urllib.robotparser, no install needed

    # Retry / resilience
    "tenacity==9.0.0",

    # Hashing / fingerprinting
    "python-multipart==0.0.19",

    # CSV / export — stdlib, no install needed

    # Logging
    "structlog==24.4.0",
    "rich==13.9.4",

    # Middleware / CORS
    "starlette==0.41.3",

    # Dev / test
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-httpx==0.33.0",
    "respx==0.21.1",
    "python-dotenv==1.0.1",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
